name: Upload Single Jar Unzipped

on:
  workflow_call:
    inputs:
      jar_path:
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # We download the workspace artifacts from the previous job
      - name: Download compiled libs
        uses: actions/download-artifact@v4
        with:
          name: compiled-libs-temp
          path: build/libs

      - name: Upload Unzipped Jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ inputs.jar_path }}
          archive: false
